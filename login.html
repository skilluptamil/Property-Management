<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PropVantage Property Owner Portal Login - Access your rental ledgers, maintenance tickets, and performance analytics.">
  <meta name="author" content="PropVantage">
  <title>Owner Login - PropVantage Property Management</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>
<body class="bg-main d-flex flex-column min-vh-100">

  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand-logo" href="index.html">
        <div class="logo-icon"><i class="fa-solid fa-building-user"></i></div>
        <div class="brand-text">Prop<span>Vantage</span></div>
      </a>
      <div class="nav-actions-wrap">
        <div class="nav-util-row d-flex align-items-center gap-2">
          <button class="nav-util-btn rtl-toggle-btn" title="Toggle RTL / LTR layout" aria-label="Toggle RTL layout"><span class="rtl-label small">RTL</span></button>
          <button class="nav-util-btn theme-toggle-btn" title="Toggle Dark / Light Theme" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
        <a href="index.html" class="btn btn-outline-custom"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Main Auth Section -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="custom-card p-4 p-sm-5 shadow-xl border-primary">
            <div class="text-center mb-4">
              <a class="navbar-brand-logo justify-content-center d-inline-flex" href="index.html">
                <div class="logo-icon"><i class="fa-solid fa-building-user"></i></div>
                <div class="brand-text fs-4">Prop<span>Vantage</span></div>
              </a>
            </div>

            <!-- Alert Notification for Auth Feedback -->
            <div id="loginAlert" style="display: none;"></div>

            <!-- Quick Demo Credential Pills -->
            <div class="mb-3 p-2 rounded-3 bg-section border border-light-custom text-center">
              <div class="small text-secondary-custom mb-2 d-inline-flex align-items-center justify-content-center gap-1" style="font-size: 0.82rem;">
                <i class="fa-solid fa-wand-magic-sparkles text-primary-custom"></i>
                <span>Quick Demo Login</span>
              </div>
              <div class="d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-sm btn-outline-custom demo-fill-btn py-1 px-3 small" data-email="owner@propvantage.com" data-pass="DemoPassword123" title="Fill Owner Account Credentials">
                  <i class="fa-solid fa-user-tie"></i> <span>Owner</span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-custom demo-fill-btn py-1 px-3 small" data-email="admin@propvantage.com" data-pass="DemoPassword123" title="Fill Admin Account Credentials">
                  <i class="fa-solid fa-shield-halved"></i> <span>Admin</span>
                </button>
              </div>
            </div>

            <form id="loginForm" novalidate>
              <!-- Email Input -->
              <div class="mb-3">
                <label for="loginEmail" class="form-label-custom">Email Address</label>
                <div class="input-icon-wrap">
                  <i class="fa-regular fa-envelope"></i>
                  <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="Enter your email address" required autocomplete="email">
                </div>
              </div>

              <!-- Password Input with Toggle -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label-custom mb-0">Password</label>
                  <a href="#" class="small text-primary-custom text-decoration-none" id="forgotPasswordBtn">Forgot password?</a>
                </div>
                <div class="position-relative">
                  <div class="input-icon-wrap">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" class="form-control form-control-custom pe-5" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                  </div>
                  <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-2 text-secondary-custom p-0 border-0 password-toggle-btn shadow-none" data-target="loginPassword" aria-label="Toggle Password Visibility">
                    <i class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Remember Me Checkbox -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                  <label class="form-check-label small text-secondary-custom" for="rememberMe">Remember me for 30 days</label>
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary-custom btn-lg w-100 mb-3 shadow-primary">
                Sign In to Dashboard <i class="fa-solid fa-arrow-right ms-2"></i>
              </button>
            </form>

            <div class="text-center pt-3 border-top border-light-custom">
              <span class="small text-secondary-custom">Don't have an owner account yet?</span>
              <a href="register.html" class="small fw-bold text-primary-custom ms-1">Register Property</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Simple Footer -->
  <footer class="py-3 bg-section border-top border-light-custom text-center small text-secondary-custom">
    <div class="container d-flex flex-wrap justify-content-center justify-content-sm-between align-items-center gap-2">
      <div>&copy; 2026 PropVantage. All rights reserved. Secure 256-Bit Encrypted Portal.</div>
      <div class="d-flex gap-2">
        <a href="privacy-policy.html" class="text-secondary-custom">Privacy</a>
        <span>•</span>
        <a href="terms-of-service.html" class="text-secondary-custom">Terms</a>
        <span>•</span>
        <a href="security-compliance.html" class="text-secondary-custom">Security</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
