<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PropVantage next-generation property management mobile app & owner tools launching soon.">
  <title>Coming Soon - PropVantage Property Management</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>
<body class="bg-main d-flex flex-column min-vh-100 position-relative overflow-x-hidden">

  <!-- Background Soft Globs -->
  <div class="soft-glow-blob" style="top: -100px; left: -100px;"></div>
  <div class="soft-glow-blob" style="bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(214, 168, 79, 0.08) 0%, transparent 70%);"></div>

  <!-- Header -->
  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand-logo" href="index.html">
        <div class="logo-icon"><i class="fa-solid fa-building-user"></i></div>
        <div class="brand-text">Prop<span>Vantage</span></div>
      </a>
      <div class="nav-actions-wrap">
        <div class="nav-util-row d-flex align-items-center gap-2">
          <button class="nav-util-btn rtl-toggle-btn" title="Toggle RTL / LTR layout" aria-label="Toggle RTL layout"><span class="rtl-label small">RTL</span></button>
          <button class="nav-util-btn theme-toggle-btn" title="Toggle Dark / Light Theme" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Countdown Content -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container text-center">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="badge-subheading badge-gold mb-3">
            <i class="fa-solid fa-sparkles"></i> Major Platform Upgrade
          </div>
          <h1 class="display-4 fw-bold mb-3">
            Something Extraordinary is Coming Soon
          </h1>
          <p class="lead text-secondary-custom mb-5">
            "We're making something better for property owners. We'll be back soon."
          </p>

          <!-- Working Live Countdown Timer -->
          <div class="row g-3 justify-content-center mb-5" style="max-width: 600px; margin: 0 auto;">
            <div class="col-3">
              <div class="custom-card p-3 p-md-4 text-center">
                <div class="display-6 fw-bold text-primary-custom" id="timerDays">45</div>
                <div class="small fw-semibold text-secondary-custom">Days</div>
              </div>
            </div>
            <div class="col-3">
              <div class="custom-card p-3 p-md-4 text-center">
                <div class="display-6 fw-bold text-primary-custom" id="timerHours">18</div>
                <div class="small fw-semibold text-secondary-custom">Hours</div>
              </div>
            </div>
            <div class="col-3">
              <div class="custom-card p-3 p-md-4 text-center">
                <div class="display-6 fw-bold text-primary-custom" id="timerMinutes">32</div>
                <div class="small fw-semibold text-secondary-custom">Minutes</div>
              </div>
            </div>
            <div class="col-3">
              <div class="custom-card p-3 p-md-4 text-center">
                <div class="display-6 fw-bold text-gold" id="timerSeconds">00</div>
                <div class="small fw-semibold text-secondary-custom">Seconds</div>
              </div>
            </div>
          </div>

          <!-- Email Notify Form -->
          <div class="mx-auto mb-5" style="max-width: 520px;">
            <h5 class="fw-bold mb-3">Get Notified When We Launch</h5>
            <form id="comingSoonNotifyForm" novalidate>
              <div class="input-group input-group-lg shadow-sm">
                <input type="email" class="form-control form-control-custom" placeholder="Enter your email address..." required aria-label="Notify email address">
                <button class="btn btn-primary-custom px-4" type="submit">Notify Me</button>
              </div>
            </form>
          </div>

          <!-- Social Links -->
          <div class="d-flex justify-content-center gap-3">
            <a href="https://facebook.com/" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="X Twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://youtube.com/" target="_blank" rel="noopener noreferrer" class="footer-social-link" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-section border-top border-light-custom text-center small text-secondary-custom">
    <div class="container">
      &copy; 2026 PropVantage Property Management. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
