<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PropVantage Admin Operations Portal - Landlord accounts, property portfolios, maintenance work orders, and financial payouts.">
  <meta name="keywords" content="property management admin, operations portal, landlord management, maintenance dispatch">
  <meta name="author" content="PropVantage">
  <title>Admin Operations Portal - PropVantage Property Management</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- ====================================================================
         SIDEBAR NAVIGATION
         ==================================================================== -->
    <aside class="dashboard-sidebar shadow-sm">
      <!-- Rendered dynamically by js/dashboard.js -->
    </aside>

    <!-- ====================================================================
         MAIN DASHBOARD BODY
         ==================================================================== -->
    <div class="dashboard-main">
      <!-- Topbar Header -->
      <header class="dashboard-topbar">
        <div class="d-flex align-items-center gap-3 flex-grow-1">
          <button class="btn btn-outline-custom p-2 sidebar-toggle-btn d-lg-none" id="sidebarToggleBtn" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars fs-5"></i>
          </button>
          
          <div class="topbar-search d-none d-md-block">
            <div class="input-icon-wrap">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" class="form-control form-control-custom form-control-sm" placeholder="Search landlords, buildings, leases, work orders..." autocomplete="off">
            </div>
          </div>
        </div>

        <div class="topbar-actions">
          <!-- Role Switcher Button injected here by js/dashboard.js -->

          <!-- RTL Switcher -->
          <button class="nav-util-btn rtl-toggle-btn" title="Toggle RTL layout" aria-label="Toggle RTL layout">
            <span class="rtl-label small">RTL</span>
          </button>

          <!-- Dark/Light Mode -->
          <button class="nav-util-btn theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Dark/Light Theme">
            <i class="fa-solid fa-moon"></i>
          </button>

          <!-- Back to Public Site -->
          <a href="index.html" class="btn btn-outline-custom btn-sm d-none d-sm-inline-flex" title="Return to Public Website">
            <i class="fa-solid fa-house me-1"></i> Public Site
          </a>
        </div>
      </header>

      <!-- Dynamic Dashboard Content View Container -->
      <main class="dashboard-content" id="dashboardContentContainer">
        <!-- Rendered dynamically by js/dashboard.js -->
      </main>

      <!-- Dashboard Footer -->
      <footer class="py-3 px-4 bg-section border-top border-light-custom text-center text-md-start d-flex flex-wrap justify-content-between align-items-center gap-2 small text-secondary-custom">
        <div>&copy; 2026 PropVantage Property Management Platform &bull; Operations Suite.</div>
        <div class="d-flex gap-3">
          <a href="index.html" class="text-secondary-custom">Home</a>
          <a href="dashboard.html" class="text-secondary-custom">Owner Portal</a>
          <a href="contact.html" class="text-secondary-custom">Support</a>
          <a href="login.html" class="text-secondary-custom">Sign Out</a>
        </div>
      </footer>
    </div>
  </div>

  <!-- Bootstrap 5.3.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Chart.js 4.4.1 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Global Core Script -->
  <script src="js/main.js"></script>
  <!-- PropVantage Dashboard Engine -->
  <script src="js/dashboard.js"></script>
</body>
</html>
