<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register your rental property with PropVantage and access our automated landlord management platform.">
  <meta name="author" content="PropVantage">
  <title>Register Property - PropVantage Property Management</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/rtl.css">
</head>
<body class="bg-main d-flex flex-column min-vh-100">

  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand-logo" href="index.html">
        <div class="logo-icon"><i class="fa-solid fa-building-user"></i></div>
        <div class="brand-text">Prop<span>Vantage</span></div>
      </a>
      <div class="nav-actions-wrap">
        <div class="nav-util-row d-flex align-items-center gap-2">
          <button class="nav-util-btn rtl-toggle-btn" title="Toggle RTL / LTR layout" aria-label="Toggle RTL layout"><span class="rtl-label small">RTL</span></button>
          <button class="nav-util-btn theme-toggle-btn" title="Toggle Dark / Light Theme" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
        <a href="index.html" class="btn btn-outline-custom"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Main Auth Section -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">
          <div class="custom-card p-4 p-sm-5 shadow-xl border-primary">
            <div class="text-center mb-4">
              <div class="floating-icon mx-auto mb-3"><i class="fa-solid fa-user-plus"></i></div>
              <h2 class="h3 fw-bold mb-1">Register Owner Account</h2>
              <p class="text-secondary-custom small mb-0">Create your landlord profile to manage properties & track cashflow</p>
            </div>

            <!-- Feedback Alert -->
            <div id="registerAlert" style="display: none;"></div>

            <form id="registerForm" novalidate>
              <div class="row g-3">
                <!-- Full Name -->
                <div class="col-12">
                  <label for="regName" class="form-label-custom">Full Name <span class="text-danger">*</span></label>
                  <div class="input-icon-wrap">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" class="form-control form-control-custom" id="regName" placeholder="Eleanor Sterling" required>
                  </div>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                  <label for="regEmail" class="form-label-custom">Email Address <span class="text-danger">*</span></label>
                  <div class="input-icon-wrap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" class="form-control form-control-custom" id="regEmail" placeholder="eleanor@example.com" required>
                  </div>
                </div>

                <!-- Phone -->
                <div class="col-md-6">
                  <label for="regPhone" class="form-label-custom">Phone Number <span class="text-danger">*</span></label>
                  <div class="input-icon-wrap">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" class="form-control form-control-custom" id="regPhone" placeholder="+1 (555) 234-5678" required>
                  </div>
                </div>

                <!-- Password with Toggle -->
                <div class="col-md-6">
                  <label for="regPassword" class="form-label-custom">Password <span class="text-danger">*</span></label>
                  <div class="position-relative">
                    <div class="input-icon-wrap">
                      <i class="fa-solid fa-key"></i>
                      <input type="password" class="form-control form-control-custom pe-5" id="regPassword" placeholder="••••••••" required>
                    </div>
                    <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-2 text-secondary-custom p-0 border-0 password-toggle-btn shadow-none" data-target="regPassword" aria-label="Toggle Password Visibility">
                      <i class="fa-regular fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div class="col-md-6">
                  <label for="regConfirmPassword" class="form-label-custom">Confirm Password <span class="text-danger">*</span></label>
                  <div class="position-relative">
                    <div class="input-icon-wrap">
                      <i class="fa-solid fa-key"></i>
                      <input type="password" class="form-control form-control-custom pe-5" id="regConfirmPassword" placeholder="••••••••" required>
                    </div>
                    <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-2 text-secondary-custom p-0 border-0 password-toggle-btn shadow-none" data-target="regConfirmPassword" aria-label="Toggle Password Visibility">
                      <i class="fa-regular fa-eye"></i>
                    </button>
                  </div>
                </div>

                <!-- Terms checkbox -->
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="regTerms" required checked>
                    <label class="form-check-label small text-secondary-custom" for="regTerms">
                      I agree to the <a href="terms-of-service.html" class="text-primary-custom" target="_blank">Terms of Service</a> and <a href="privacy-policy.html" class="text-primary-custom" target="_blank">Privacy Policy</a>
                    </label>
                  </div>
                </div>

                <!-- Submit Button -->
                <div class="col-12 mt-4">
                  <button type="submit" class="btn btn-primary-custom btn-lg w-100">
                    Create Owner Account <i class="fa-solid fa-arrow-right ms-2"></i>
                  </button>
                </div>
              </div>
            </form>

            <div class="text-center pt-3 mt-4 border-top border-light-custom">
              <span class="small text-secondary-custom">Already have an account?</span>
              <a href="login.html" class="small fw-bold text-primary-custom ms-1">Sign In</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 bg-section border-top border-light-custom text-center small text-secondary-custom">
    <div class="container d-flex flex-wrap justify-content-center justify-content-sm-between align-items-center gap-2">
      <div>&copy; 2026 PropVantage. All rights reserved. Secure 256-Bit Encrypted Portal.</div>
      <div class="d-flex gap-2">
        <a href="privacy-policy.html" class="text-secondary-custom">Privacy</a>
        <span>•</span>
        <a href="terms-of-service.html" class="text-secondary-custom">Terms</a>
        <span>•</span>
        <a href="security-compliance.html" class="text-secondary-custom">Security</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
